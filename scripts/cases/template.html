<!DOCTYPE html>
<html lang="{{html_lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>{{title}}</title>
    <meta name="description" content="{{meta_desc}}">
    <meta name="author" content="Vitor Silva">
    <link rel="canonical" href="{{canonical}}">
    <link rel="alternate" hreflang="en" href="{{url_en}}" />
    <link rel="alternate" hreflang="pt-BR" href="{{url_pt}}" />
    <link rel="alternate" hreflang="x-default" href="{{url_en}}" />
    <meta property="og:type" content="article">
    <meta property="og:title" content="{{og_title}}">
    <meta property="og:description" content="{{meta_desc}}">
    <meta property="og:url" content="{{canonical}}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{og_title}}">
    <meta name="twitter:description" content="{{meta_desc}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    /* Generated by scripts/build_cases.py: edit the template or scripts/cases/<slug>.py, never this file.
       Same design tokens as the portfolio home (index.en.html). */
    :root {
        --black: #000000; --black-card: #080808;
        --green: #00ff41; --green-dim: #00cc33; --green-dark: #006622;
        --muted: #4f8a4f; --text: #b8e0b8; --amber: #d9a21b;
        --mono: 'IBM Plex Mono', monospace; --display: 'Syne', sans-serif;
        --glow-text: 0 0 4px #00ff41, 0 0 12px #00ff41, 0 0 28px #00cc33;
        --glow-box: 0 0 5px rgba(0,255,65,0.35), 0 0 14px rgba(0,255,65,0.15), 0 0 30px rgba(0,204,51,0.08);
        --border-c: rgba(0,255,65,0.24);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { background: var(--black); color: var(--text); font-family: var(--mono); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    .crt { position: fixed; inset: 0; z-index: 1; pointer-events: none;
        background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(0,0,0,0.07) 3px, rgba(0,0,0,0.07) 4px); }
    .site { position: relative; z-index: 10; }
    .wrap { width: min(1100px, calc(100% - 2rem)); margin: 0 auto; }
    .sec { padding: 4.5rem 0; }
    .sep { border: none; border-top: 1px solid rgba(0,255,65,0.1); }
    a { color: var(--green); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    code { font-size: 0.92em; color: var(--text); background: rgba(0,255,65,0.06); padding: 0 0.25rem; }

    .prompt { font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--green-dim); display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    .prompt::before { content: '>'; color: var(--green); text-shadow: var(--glow-text); font-weight: 700; }
    h2 { font-family: var(--display); font-weight: 900; font-size: clamp(1.8rem, 4vw, 2.8rem); line-height: 1.08; color: var(--text); margin-bottom: 0.8rem; }
    h2 .g { color: var(--green); text-shadow: var(--glow-text); }
    .lead { font-size: 0.88rem; color: var(--muted); max-width: 62ch; line-height: 1.8; margin-bottom: 2.2rem; }
    .card { background: var(--black-card); border: 1px solid var(--border-c); border-radius: 2px; box-shadow: var(--glow-box); }

    .hdr { position: sticky; top: 0; z-index: 80; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(0,255,65,0.15); }
    .hdr-in { display: flex; align-items: center; gap: 1rem; min-height: 3.8rem; }
    .brand { text-decoration: none; display: flex; align-items: center; gap: 0.6rem; }
    .brand-mark { width: 2.3rem; height: 2.3rem; border: 1px solid rgba(0,255,65,0.4); border-radius: 2px; display: grid; place-items: center; font-weight: 700; font-size: 0.8rem; color: var(--green); text-shadow: var(--glow-text); box-shadow: var(--glow-box); }
    .brand-name { font-weight: 700; font-size: 0.8rem; color: var(--green); letter-spacing: 0.04em; }
    .hdr-nav { margin-left: auto; display: flex; gap: 1.2rem; align-items: center; }
    .hdr-nav a { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
    .hdr-nav a:hover { color: var(--green); }
    .lang { display: flex; border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 2px; }
    .lang a { padding: 0.25rem 0.55rem; border-radius: 999px; font-size: 0.62rem; font-weight: 700; }
    .lang a.on { background: rgba(0,255,65,0.15); color: var(--green); }

    .btn { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--mono); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none; padding: 0.62rem 1.15rem; border-radius: 2px; border: 1px solid rgba(0,255,65,0.38); background: transparent; color: var(--green); box-shadow: var(--glow-box); cursor: pointer; transition: background .2s; }
    .btn:hover { background: rgba(0,255,65,0.08); }
    .btn-solid { background: rgba(0,255,65,0.1); border-color: rgba(0,255,65,0.55); }

    .hero { padding: 5rem 0 3.5rem; }
    .crumbs { font-size: 0.62rem; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 1.4rem; text-transform: uppercase; }
    .crumbs a { color: var(--muted); text-decoration: none; }
    .crumbs a:hover { color: var(--green); }
    .hero h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.8rem, 9vw, 6.4rem); line-height: 0.92; color: var(--green); text-shadow: var(--glow-text); margin-bottom: 1rem; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .hero-sub { font-size: clamp(0.95rem, 1.9vw, 1.15rem); font-weight: 500; color: var(--text); max-width: 46rem; line-height: 1.65; margin-bottom: 0.9rem; }
    .hero-copy { font-size: 0.85rem; color: var(--muted); max-width: 44rem; line-height: 1.8; margin-bottom: 1.6rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-bottom: 1.8rem; }
    .chip { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.3rem 0.6rem; border: 1px solid rgba(0,255,65,0.2); background: rgba(0,255,65,0.05); color: var(--green-dim); border-radius: 2px; }
    .chip.amber { border-color: rgba(217,162,27,0.35); background: rgba(217,162,27,0.06); color: var(--amber); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.8rem; }
    .notice { margin-top: 2.2rem; padding: 0.95rem 1.1rem; border: 1px solid rgba(217,162,27,0.35); background: rgba(217,162,27,0.05); border-left: 3px solid var(--amber); font-size: 0.78rem; color: #c9b27a; line-height: 1.7; max-width: 52rem; }
    .notice strong { color: var(--amber); }

    .nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.9rem; }
    .num { padding: 1.2rem 1.15rem; }
    .num-v { font-family: var(--display); font-weight: 900; font-size: 2.1rem; line-height: 1; color: var(--green); text-shadow: var(--glow-text); overflow-wrap: anywhere; }
    .num-k { font-size: 0.72rem; color: var(--text); margin-top: 0.55rem; font-weight: 600; }
    .num-d { font-size: 0.7rem; color: var(--muted); margin-top: 0.3rem; line-height: 1.6; }
    .num.honest .num-v { color: var(--amber); text-shadow: none; }
    .src { font-size: 0.6rem; color: var(--green-dark); margin-top: 0.5rem; word-break: break-all; }

    .demo { padding: 1.5rem; display: grid; grid-template-columns: 1.4fr 1fr; gap: 1.5rem; align-items: center; }
    .demo p { font-size: 0.82rem; color: var(--muted); line-height: 1.75; }
    .demo p + p { margin-top: 0.7rem; }
    .demo .actions { justify-content: flex-end; }
    .wake { font-size: 0.7rem; color: #a8893f; }

    .arch-wrap { padding: 1.2rem; overflow-x: auto; }
    .arch { width: 100%; min-width: 760px; height: auto; display: block; }
    .arch rect.n { fill: #050c05; stroke: rgba(0,255,65,0.45); stroke-width: 1; }
    .arch rect.lane { fill: rgba(0,255,65,0.02); stroke: rgba(0,255,65,0.12); stroke-dasharray: 4 4; }
    .arch text { font-family: 'IBM Plex Mono', monospace; fill: #b8e0b8; font-size: 12px; }
    .arch text.t { fill: #00ff41; font-weight: 600; font-size: 12.5px; }
    .arch text.s { fill: #4f8a4f; font-size: 10.5px; }
    .arch text.lt { fill: #00cc33; font-size: 10.5px; letter-spacing: 0.14em; }
    .arch line { stroke: #00cc33; stroke-width: 1.3; fill: none; }
    .arch-note { font-size: 0.72rem; color: var(--muted); margin-top: 0.9rem; line-height: 1.7; max-width: 70ch; }

    .story { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
    .st { padding: 1.4rem; }
    .st-k { font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--green-dark); margin-bottom: 0.6rem; }
    .st h3 { font-family: var(--display); font-weight: 800; font-size: 1.15rem; color: var(--green); margin-bottom: 0.6rem; line-height: 1.2; }
    .st p { font-size: 0.8rem; color: var(--muted); line-height: 1.75; }
    .st p + p { margin-top: 0.7rem; }

    .ev { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; align-items: start; }
    .ev.one { grid-template-columns: 1fr; max-width: 860px; }
    figure { padding: 0.8rem; }
    figure img { width: 100%; height: auto; display: block; border: 1px solid rgba(0,255,65,0.12); }
    figcaption { font-size: 0.68rem; color: var(--muted); margin-top: 0.6rem; line-height: 1.6; }

    .video { position: relative; aspect-ratio: 16 / 9; max-width: 820px; overflow: hidden; }
    .video button { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; cursor: pointer; background: #020502 center / cover no-repeat; }
    .video button::after { content: '▶'; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 4.4rem; height: 4.4rem; border-radius: 50%; display: grid; place-items: center; font-size: 1.5rem; color: var(--black); background: var(--green); box-shadow: var(--glow-box); }
    .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .video-note { font-size: 0.72rem; color: var(--muted); margin-top: 0.8rem; }

    .limits { list-style: none; display: grid; gap: 0.55rem; max-width: 62rem; }
    .limits li { font-size: 0.8rem; color: var(--muted); line-height: 1.7; padding-left: 1.1rem; position: relative; }
    .limits li::before { content: '→'; position: absolute; left: 0; color: var(--green-dark); }

    .footer { padding: 2.5rem 0 3rem; border-top: 1px solid rgba(0,255,65,0.1); font-size: 0.7rem; color: var(--muted); }
    .footer .wrap { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
    .footer a { color: var(--green-dim); text-decoration: none; margin-left: 1rem; }

    @media (max-width: 860px) {
        .nums { grid-template-columns: 1fr 1fr; }
        .story, .ev, .demo { grid-template-columns: 1fr; }
        .demo .actions { justify-content: flex-start; }
        .hdr-nav .hide-sm { display: none; }
    }
    @media (max-width: 520px) { .nums { grid-template-columns: 1fr; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
</head>
<body>
<div class="crt" aria-hidden="true"></div>
<div class="site">

<header class="hdr">
    <div class="wrap hdr-in">
        <a class="brand" href="{{home_href}}">
            <span class="brand-mark">VS</span>
            <span class="brand-name">VITOR_SILVA</span>
        </a>
        <nav class="hdr-nav" aria-label="{{ui_nav_label}}">
            {{nav_links}}
            <a href="{{home_href}}#projects">{{ui_back}}</a>
            <span class="lang">
                <a href="./" class="{{en_on}}" hreflang="en">EN</a>
                <a href="index.pt.html" class="{{pt_on}}" hreflang="pt-BR">PT</a>
            </span>
        </nav>
    </div>
</header>

<main>
<section class="hero">
    <div class="wrap">
        <div class="crumbs"><a href="{{home_href}}#projects">{{ui_projects}}</a> / {{index}} · {{tag}}</div>
        <h1>{{name}}</h1>
        <p class="hero-sub">{{hero_sub}}</p>
        <p class="hero-copy">{{hero_copy}}</p>
        <div class="chips">{{chips}}</div>
        <div class="actions">{{hero_actions}}</div>
        {{notice}}
    </div>
</section>
{{sections}}
</main>

<footer class="footer">
    <div class="wrap">
        <span>© 2026 Vitor Silva · Curitiba, PR</span>
        <span><a href="{{home_href}}">vitorsilva.page</a><a href="https://www.linkedin.com/in/vitorsilva-aieng/" target="_blank" rel="noreferrer">LinkedIn</a><a href="https://github.com/vdfs89" target="_blank" rel="noreferrer">GitHub</a></span>
    </div>
</footer>
</div>
{{video_script}}
</body>
</html>
